<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视觉暂留</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-x:hidden;background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px 12px 100px}
header{text-align:center;margin-bottom:16px;width:100%;max-width:800px}
h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:0.04em}
.subtitle{font-size:0.95rem;color:#888;margin-top:4px}
.tip{font-size:0.82rem;color:#666;margin-top:8px;line-height:1.5;max-width:600px;margin-left:auto;margin-right:auto}
.canvas-wrap{position:relative;width:100%;max-width:800px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 0 40px rgba(100,100,255,0.08)}
.canvas-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#overlayCanvas{z-index:1}
#videoCanvas{z-index:2;opacity:0;pointer-events:none}
.fps{position:absolute;top:10px;right:12px;z-index:10;font-size:0.75rem;color:#4ade80;font-family:monospace;background:rgba(0,0,0,0.5);padding:2px 8px;border-radius:6px}
.loading-overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,15,0.92);transition:opacity 0.4s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;color:#888;font-size:0.9rem}
.error-msg{color:#f87171;font-size:0.9rem;text-align:center;padding:20px;line-height:1.6}
.error-msg button{margin-top:12px;padding:8px 20px;background:#a78bfa;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.85rem}
.controls{width:100%;max-width:800px;margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.ctrl-group{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);padding:6px 12px;border-radius:10px}
.ctrl-group label{font-size:0.78rem;color:#999;white-space:nowrap}
.ctrl-group select,.ctrl-group input[type=range]{background:#1a1a24;color:#e0e0e0;border:1px solid #333;border-radius:6px;padding:4px 8px;font-size:0.8rem;outline:none}
.ctrl-group input[type=range]{width:100px;cursor:pointer}
.ctrl-group select{cursor:pointer}
.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;width:100%;max-width:800px}
.btn{padding:8px 18px;border:none;border-radius:10px;font-size:0.85rem;cursor:pointer;font-weight:500;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff}
.btn-primary:hover{transform:scale(1.03);box-shadow:0 0 16px rgba(167,139,250,0.3)}
.btn-secondary{background:rgba(255,255,255,0.08);color:#ccc;border:1px solid #333}
.btn-secondary:hover{background:rgba(255,255,255,0.12)}
.btn-danger{background:rgba(248,113,113,0.15);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
.btn-danger:hover{background:rgba(248,113,113,0.25)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
@media(max-width:600px){
h1{font-size:1.5rem}
.canvas-wrap{aspect-ratio:3/4;max-width:100%}
.controls{gap:6px}
.ctrl-group{padding:4px 8px}
.ctrl-group input[type=range]{width:70px}
.btn{padding:6px 14px;font-size:0.8rem}
}
@media(prefers-reduced-motion:reduce){
.spinner{animation:none}
}
@media print{
.controls,.buttons,.fps,.loading-overlay{display:none!important}
body{background:#fff;color:#000}
.canvas-wrap{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>
<div id="app">
<header>
<h1>视觉暂留</h1>
<p class="subtitle">运动轨迹变成残影画</p>
<p class="tip">快速移动你的身体，网页会把运动轨迹变成一幅残影画。动作越快，轨迹越明显；背景越干净，效果越好看。</p>
</header>
<div class="canvas-wrap" id="canvasWrap">
<canvas id="overlayCanvas"></canvas>
<canvas id="videoCanvas"></canvas>
<div class="fps" id="fpsDisplay">-- FPS</div>
<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<p class="loading-text" id="loadingText">正在请求摄像头权限…</p>
</div>
</div>
<div class="controls">
<div class="ctrl-group">
<label for="fadeRange">残影强度</label>
<input type="range" id="fadeRange" min="2" max="30" value="8" step="1">
</div>
<div class="ctrl-group">
<label for="blendMode">混合模式</label>
<select id="blendMode">
<option value="source-over">正常</option>
<option value="overlay">叠加</option>
<option value="screen">滤色</option>
<option value="lighten">变亮</option>
</select>
</div>
<div class="ctrl-group">
<label for="colorFilter">色彩滤镜</label>
<select id="colorFilter">
<option value="original">原色</option>
<option value="neon">霓虹</option>
<option value="bw">黑白</option>
<option value="warm">暖色</option>
<option value="cool">冷色</option>
</select>
</div>
</div>
<div class="buttons">
<button class="btn btn-primary" id="btnStart">开始</button>
<button class="btn btn-secondary" id="btnPause" disabled>暂停</button>
<button class="btn btn-danger" id="btnClear">清空画布</button>
<button class="btn btn-secondary" id="btnSave" disabled>保存图片</button>
</div>
</div>
<script>
(function(){
try{
var overlayCanvas=document.getElementById('overlayCanvas');
var videoCanvas=document.getElementById('videoCanvas');
var overlayCtx=overlayCanvas.getContext('2d');
var videoCtx=videoCanvas.getContext('2d');
var fpsDisplay=document.getElementById('fpsDisplay');
var loadingOverlay=document.getElementById('loadingOverlay');
var loadingText=document.getElementById('loadingText');
var canvasWrap=document.getElementById('canvasWrap');
var fadeRange=document.getElementById('fadeRange');
var blendModeSelect=document.getElementById('blendMode');
var colorFilterSelect=document.getElementById('colorFilter');
var btnStart=document.getElementById('btnStart');
var btnPause=document.getElementById('btnPause');
var btnClear=document.getElementById('btnClear');
var btnSave=document.getElementById('btnSave');
var videoEl=null;
var stream=null;
var running=false;
var animId=null;
var lastFrameTime=0;
var frameInterval=1000/30;
var fpsFrames=0;
var fpsLastTime=performance.now();
var reducedMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var W=0,H=0;
function resizeCanvases(){
var rect=canvasWrap.getBoundingClientRect();
W=Math.round(rect.width);
H=Math.round(rect.height);
var dpr=Math.min(window.devicePixelRatio||1,2);
overlayCanvas.width=W*dpr;
overlayCanvas.height=H*dpr;
videoCanvas.width=W*dpr;
videoCanvas.height=H*dpr;
overlayCtx.setTransform(dpr,0,0,dpr,0,0);
videoCtx.setTransform(dpr,0,0,dpr,0,0);
}
function showError(msg){
loadingOverlay.classList.remove('hidden');
loadingOverlay.innerHTML='<div class="error-msg"><p>'+msg+'</p><button onclick="location.reload()">重试</button></div>';
}
function getFilterCSS(){
var v=colorFilterSelect.value;
switch(v){
case'neon':return'saturate(2.5) brightness(1.2) contrast(1.1)';
case'bw':return'grayscale(1)';
case'warm':return'sepia(0.4) saturate(1.3)';
case'cool':return'saturate(0.8) hue-rotate(30deg) brightness(1.1)';
default:return'none';
}
}
function render(timestamp){
if(!running)return;
animId=requestAnimationFrame(render);
var delta=timestamp-lastFrameTime;
if(delta<frameInterval)return;
lastFrameTime=timestamp-(delta%frameInterval);
fpsFrames++;
if(timestamp-fpsLastTime>=1000){
fpsDisplay.textContent=fpsFrames+' FPS';
fpsFrames=0;
fpsLastTime=timestamp;
}
if(!videoEl||videoEl.readyState<2)return;
var fadeAlpha=parseInt(fadeRange.value)/100;
var blend=blendModeSelect.value;
videoCtx.save();
videoCtx.translate(W,0);
videoCtx.scale(-1,1);
videoCtx.drawImage(videoEl,0,0,W,H);
videoCtx.restore();
if(reducedMotion){
overlayCtx.clearRect(0,0,W,H);
overlayCtx.globalCompositeOperation='source-over';
overlayCtx.globalAlpha=1;
overlayCtx.drawImage(videoCanvas,0,0,W,H);
}else{
overlayCtx.globalCompositeOperation='source-over';
overlayCtx.globalAlpha=fadeAlpha;
overlayCtx.fillStyle='#000000';
overlayCtx.fillRect(0,0,W,H);
overlayCtx.globalCompositeOperation=blend;
overlayCtx.globalAlpha=1;
var filt=getFilterCSS();
if(filt!=='none'){
overlayCtx.filter=filt;
}
overlayCtx.drawImage(videoCanvas,0,0,W,H);
overlayCtx.filter='none';
}
}
async function startCamera(){
loadingOverlay.classList.remove('hidden');
loadingText.textContent='正在请求摄像头权限…';
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
videoEl=document.createElement('video');
videoEl.srcObject=stream;
videoEl.setAttribute('playsinline','');
videoEl.muted=true;
await videoEl.play();
resizeCanvases();
loadingOverlay.classList.add('hidden');
btnStart.disabled=true;
btnPause.disabled=false;
btnSave.disabled=false;
running=true;
lastFrameTime=performance.now();
fpsLastTime=performance.now();
fpsFrames=0;
animId=requestAnimationFrame(render);
}catch(e){
console.error('Camera error:',e);
if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'){
showError('摄像头权限被拒绝。<br>请在浏览器设置中允许访问摄像头后重试。');
}else if(e.name==='NotFoundError'||e.name==='DevicesNotFoundError'){
showError('未检测到摄像头设备。<br>请确认已连接摄像头。');
}else if(e.name==='NotReadableError'){
showError('摄像头被其他程序占用。<br>请关闭后重试。');
}else{
showError('无法访问摄像头：'+e.message);
}
}
}
function stopCamera(){
running=false;
if(animId){cancelAnimationFrame(animId);animId=null;}
if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
if(videoEl){videoEl.srcObject=null;videoEl=null;}
btnStart.disabled=false;
btnPause.disabled=true;
btnSave.disabled=true;
}
btnStart.addEventListener('click',function(){
if(!running)startCamera();
});
btnPause.addEventListener('click',function(){
if(running){
running=false;
if(animId){cancelAnimationFrame(animId);animId=null;}
btnPause.textContent='继续';
}else{
running=true;
lastFrameTime=performance.now();
fpsLastTime=performance.now();
fpsFrames=0;
animId=requestAnimationFrame(render);
btnPause.textContent='暂停';
}
});
btnClear.addEventListener('click',function(){
overlayCtx.clearRect(0,0,W,H);
});
btnSave.addEventListener('click',function(){
var link=document.createElement('a');
link.download='visual-persistence-'+Date.now()+'.png';
link.href=overlayCanvas.toDataURL('image/png');
link.click();
});
window.addEventListener('resize',function(){
resizeCanvases();
});
resizeCanvases();
startCamera();
}catch(e){
console.error('Init error:',e);
var lo=document.getElementById('loadingOverlay');
if(lo){
lo.classList.remove('hidden');
lo.innerHTML='<div class="error-msg"><p>初始化失败：'+e.message+'</p><button onclick="location.reload()">重试</button></div>';
}
}
})();
</script>
</body>
</html>
