<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风格迁移</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e8e8f0;--text2:#8888a0;--accent:#6c5ce7;--accent2:#00cec9;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,0.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:2rem 1rem 1rem}
.header h1{font-size:clamp(1.8rem,5vw,2.6rem);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.4rem;font-weight:800;letter-spacing:.02em}
.header .subtitle{color:var(--text2);font-size:clamp(.85rem,2.5vw,1.05rem);margin-bottom:.3rem}
.header .hint{color:var(--text2);font-size:clamp(.75rem,2vw,.88rem);opacity:.75}
.container{max-width:1280px;margin:0 auto;padding:0 1rem 2rem}
.controls{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:center;padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1.2rem;box-shadow:var(--shadow)}
.control-group{display:flex;align-items:center;gap:.5rem}
.control-group label{font-size:.85rem;color:var(--text2);white-space:nowrap}
select{background:#252838;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.45rem .8rem;font-size:.9rem;cursor:pointer;outline:none;transition:border-color .2s}
select:hover,select:focus{border-color:var(--accent)}
.slider-wrap{display:flex;align-items:center;gap:.5rem}
.slider-wrap span{font-size:.85rem;color:var(--accent2);min-width:2ch;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:6px;background:#333;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--accent2);cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--accent2);cursor:pointer}
.btn{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;border:none;border-radius:8px;padding:.5rem 1.1rem;font-size:.88rem;cursor:pointer;transition:opacity .2s,transform .15s;font-weight:600}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.video-area{display:grid;grid-template-columns:1fr 1fr;gap:1rem;position:relative}
.video-box{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);aspect-ratio:16/9}
.video-box video,.video-box canvas{width:100%;height:100%;object-fit:cover;display:block}
.video-label{position:absolute;top:.6rem;left:.6rem;background:rgba(0,0,0,.6);color:var(--text2);font-size:.75rem;padding:.2rem .6rem;border-radius:6px;backdrop-filter:blur(4px);z-index:2}
.fps-display{position:fixed;top:.8rem;right:.8rem;background:rgba(0,0,0,.7);color:var(--accent2);font-size:.8rem;padding:.3rem .7rem;border-radius:6px;font-family:monospace;z-index:100;backdrop-filter:blur(4px)}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1.2rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:.95rem;text-align:center;line-height:1.6}
.error-box{background:#2d1b1b;border:1px solid #5a2a2a;border-radius:var(--radius);padding:1.5rem;text-align:center;margin:2rem auto;max-width:420px}
.error-box h3{color:#ff6b6b;margin-bottom:.6rem}
.error-box p{color:var(--text2);font-size:.88rem;margin-bottom:1rem}
@media(max-width:768px){
  .video-area{grid-template-columns:1fr}
  .controls{flex-direction:column;gap:.6rem}
  .control-group{width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media print{
  body{background:#fff;color:#000}
  .controls,.fps-display,.btn,.loading-overlay,.header .hint{display:none!important}
  .video-box{border:1px solid #ccc}
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">正在初始化...</div>
</div>
<div class="fps-display" id="fpsDisplay">FPS: --</div>
<header class="header">
  <h1>风格迁移</h1>
  <p class="subtitle">实时画面艺术化 · 5 种风格</p>
  <p class="hint">开启摄像头，实时把你的画面变成艺术画作！点击截图保存作品。</p>
</header>
<main class="container">
  <div class="controls" id="controls">
    <div class="control-group">
      <label for="styleSelect">风格：</label>
      <select id="styleSelect">
        <option value="original">原图</option>
        <option value="sketch">素描</option>
        <option value="oilpaint">油画</option>
        <option value="cyberpunk">赛博朋克</option>
        <option value="ink">水墨</option>
      </select>
    </div>
    <div class="control-group slider-wrap">
      <label for="intensitySlider">强度：</label>
      <input type="range" id="intensitySlider" min="0" max="100" value="70">
      <span id="intensityValue">70</span>
    </div>
    <button class="btn" id="screenshotBtn">📷 截图保存</button>
    <button class="btn" id="retryBtn" style="display:none">🔄 重试</button>
  </div>
  <div id="errorContainer"></div>
  <div class="video-area" id="videoArea">
    <div class="video-box">
      <div class="video-label">原始画面</div>
      <video id="videoEl" autoplay playsinline muted></video>
    </div>
    <div class="video-box">
      <div class="video-label" id="outputLabel">风格输出</div>
      <canvas id="outputCanvas"></canvas>
    </div>
  </div>
</main>
<script>
(function(){
'use strict';
try {
  const $ = id => document.getElementById(id);
  const videoEl = $('videoEl');
  const outputCanvas = $('outputCanvas');
  const ctx = outputCanvas.getContext('2d', {willReadFrequently: true});
  const styleSelect = $('styleSelect');
  const intensitySlider = $('intensitySlider');
  const intensityValue = $('intensityValue');
  const screenshotBtn = $('screenshotBtn');
  const retryBtn = $('retryBtn');
  const fpsDisplay = $('fpsDisplay');
  const loadingOverlay = $('loadingOverlay');
  const loadingText = $('loadingText');
  const errorContainer = $('errorContainer');
  const outputLabel = $('outputLabel');
  const PROC_W = 640, PROC_H = 360;
  const offscreen = document.createElement('canvas');
  offscreen.width = PROC_W; offscreen.height = PROC_H;
  const offCtx = offscreen.getContext('2d', {willReadFrequently: true});
  let currentStyle = 'original', intensity = 70, animId = null;
  let frameCount = 0, lastFpsTime = performance.now(), fps = 0;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const throttleMs = reducedMotion ? 100 : 0;
  let lastProcessTime = 0;
  function setLoading(text) { loadingText.textContent = text; }
  function hideLoading() { loadingOverlay.classList.add('hidden'); }
  function showError(msg) {
    errorContainer.innerHTML = `<div class="error-box"><h3>摄像头不可用</h3><p>${msg}</p></div>`;
    retryBtn.style.display = 'inline-block';
    hideLoading();
  }
  async function initCamera() {
    setLoading('正在请求摄像头权限...');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode:'user', width:{ideal:640}, height:{ideal:360}},
        audio: false
      });
      setLoading('摄像头已连接，正在启动视频流...');
      videoEl.srcObject = stream;
      await videoEl.play();
      setLoading('视频流就绪，初始化画布...');
      outputCanvas.width = PROC_W;
      outputCanvas.height = PROC_H;
      hideLoading();
      startLoop();
    } catch(e) {
      const msg = e.name === 'NotAllowedError'
        ? '摄像头权限被拒绝，请在浏览器设置中允许访问摄像头。'
        : e.name === 'NotFoundError'
        ? '未检测到摄像头设备，请确认摄像头已连接。'
        : `初始化失败：${e.message}`;
      showError(msg);
    }
  }
  function startLoop() {
    function loop(ts) {
      animId = requestAnimationFrame(loop);
      if (throttleMs && ts - lastProcessTime < throttleMs) return;
      lastProcessTime = ts;
      if (videoEl.readyState < 2) return;
      offCtx.drawImage(videoEl, 0, 0, PROC_W, PROC_H);
      const src = offCtx.getImageData(0, 0, PROC_W, PROC_H);
      let out;
      switch(currentStyle) {
        case 'sketch': out = applySketch(src, intensity); break;
        case 'oilpaint': out = applyOilPaint(src, intensity); break;
        case 'cyberpunk': out = applyCyberpunk(src, intensity); break;
        case 'ink': out = applyInk(src, intensity); break;
        default: out = src;
      }
      ctx.putImageData(out, 0, 0);
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
        frameCount = 0;
        lastFpsTime = now;
        fpsDisplay.textContent = `FPS: ${fps}`;
      }
    }
    animId = requestAnimationFrame(loop);
  }
  // Grayscale helper
  function toGray(data) {
    const g = new Uint8ClampedArray(data.length);
    for (let i = 0; i < data.length; i += 4) {
      const v = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
      g[i] = g[i+1] = g[i+2] = v; g[i+3] = 255;
    }
    return g;
  }
  // Box blur helper (radius r)
  function boxBlur(src, w, h, r) {
    const dst = new Uint8ClampedArray(src.length);
    const size = (2*r+1)*(2*r+1);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let sr=0,sg=0,sb=0;
        for (let dy=-r; dy<=r; dy++) {
          for (let dx=-r; dx<=r; dx++) {
            const nx = Math.min(w-1, Math.max(0, x+dx));
            const ny = Math.min(h-1, Math.max(0, y+dy));
            const idx = (ny*w+nx)*4;
            sr += src[idx]; sg += src[idx+1]; sb += src[idx+2];
          }
        }
        const idx = (y*w+x)*4;
        dst[idx]=sr/size; dst[idx+1]=sg/size; dst[idx+2]=sb/size; dst[idx+3]=255;
      }
    }
    return dst;
  }
  // Style: Sketch
  function applySketch(src, t) {
    const t01 = t/100;
    const gray = toGray(src.data);
    const radius = Math.max(1, Math.round(3 + t01*10));
    const blurred = boxBlur(gray, PROC_W, PROC_H, radius);
    const out = new ImageData(PROC_W, PROC_H);
    for (let i = 0; i < gray.length; i += 4) {
      const g = gray[i];
      const b = blurred[i];
      // Color dodge: g / (255 - b + 0.001) * 255
      const v = Math.min(255, (g * 256) / (256 - b));
      const mixed = g * (1-t01) + v * t01;
      out.data[i] = out.data[i+1] = out.data[i+2] = mixed;
      out.data[i+3] = 255;
    }
    return out;
  }
  // Style: Oil Paint (quantize + local mean)
  function applyOilPaint(src, t) {
    const t01 = t/100;
    const levels = Math.max(2, Math.round(16 - t01*12));
    const radius = Math.max(1, Math.round(1 + t01*3));
    const quantized = new Uint8ClampedArray(src.data.length);
    for (let i = 0; i < src.data.length; i += 4) {
      quantized[i] = Math.round(src.data[i]/256*levels)/levels*255;
      quantized[i+1] = Math.round(src.data[i+1]/256*levels)/levels*255;
      quantized[i+2] = Math.round(src.data[i+2]/256*levels)/levels*255;
      quantized[i+3] = 255;
    }
    const blurred = boxBlur(quantized, PROC_W, PROC_H, radius);
    const out = new ImageData(PROC_W, PROC_H);
    const mix = t01;
    for (let i = 0; i < src.data.length; i += 4) {
      out.data[i] = src.data[i]*(1-mix) + blurred[i]*mix;
      out.data[i+1] = src.data[i+1]*(1-mix) + blurred[i+1]*mix;
      out.data[i+2] = src.data[i+2]*(1-mix) + blurred[i+2]*mix;
      out.data[i+3] = 255;
    }
    return out;
  }
  // Style: Cyberpunk
  function applyCyberpunk(src, t) {
    const t01 = t/100;
    const out = new ImageData(PROC_W, PROC_H);
    const contrast = 1 + t01 * 1.2;
    const offset = Math.round(t01 * 8);
    for (let i = 0; i < src.data.length; i += 4) {
      let r = src.data[i], g = src.data[i+1], b = src.data[i+2];
      // High contrast
      r = Math.min(255, Math.max(0, ((r/255 - 0.5)*contrast + 0.5)*255));
      g = Math.min(255, Math.max(0, ((g/255 - 0.5)*contrast + 0.5)*255));
      b = Math.min(255, Math.max(0, ((b/255 - 0.5)*contrast + 0.5)*255));
      // Channel shift: red -> purple tint, blue -> cyan tint
      const pixIdx = i/4;
      const x = pixIdx % PROC_W;
      const y = Math.floor(pixIdx / PROC_W);
      const srcR = (y < PROC_H && x+offset < PROC_W) ? src.data[(y*PROC_W+x+offset)*4] : r;
      const srcB = (y < PROC_H && x-offset >= 0) ? src.data[(y*PROC_W+x-offset)*4+2] : b;
      r = r*0.6 + srcR*0.4; // red shifted toward purple
      b = b*0.5 + srcB*0.3 + g*0.2; // blue shifted toward cyan
      // Scanlines
      if (y % 3 === 0) { r *= 0.75; g *= 0.75; b *= 0.75; }
      out.data[i] = r; out.data[i+1] = g; out.data[i+2] = b; out.data[i+3] = 255;
    }
    return out;
  }
  // Style: Ink (threshold + blur)
  function applyInk(src, t) {
    const t01 = t/100;
    const threshold = 100 + t01*80;
    const blurR = Math.max(1, Math.round(t01*2));
    const gray = toGray(src.data);
    const out = new ImageData(PROC_W, PROC_H);
    // Threshold
    for (let i = 0; i < gray.length; i += 4) {
      const v = gray[i] > threshold ? 255 : 0;
      out.data[i] = out.data[i+1] = out.data[i+2] = v;
      out.data[i+3] = 255;
    }
    // Slight blur for ink bleed
    if (blurR > 0) {
      const blurred = boxBlur(new Uint8ClampedArray(out.data), PROC_W, PROC_H, blurR);
      for (let i = 0; i < blurred.length; i++) out.data[i] = blurred[i];
    }
    return out;
  }
  // Controls
  styleSelect.addEventListener('change', () => {
    currentStyle = styleSelect.value;
    outputLabel.textContent = currentStyle === 'original' ? '原图输出' : styleSelect.options[styleSelect.selectedIndex].text + ' 输出';
  });
  intensitySlider.addEventListener('input', () => {
    intensity = +intensitySlider.value;
    intensityValue.textContent = intensity;
  });
  screenshotBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `风格迁移_${currentStyle}_${Date.now()}.png`;
    link.href = outputCanvas.toDataURL('image/png');
    link.click();
  });
  retryBtn.addEventListener('click', () => {
    errorContainer.innerHTML = '';
    retryBtn.style.display = 'none';
    loadingOverlay.classList.remove('hidden');
    initCamera();
  });
  // Init
  initCamera();
} catch(e) {
  console.error('Style Transfer Init Error:', e);
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.innerHTML = `<div class="error-box"><h3>初始化失败</h3><p>${e.message}</p></div>`;
  }
}
})();
</script>
</body>
</html>
