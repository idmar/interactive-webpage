<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>表情识别</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d28;--accent:#6c5ce7;--accent2:#a29bfe;--text:#e8e8f0;--muted:#6b7280;--radius:16px;--green:#00b894;--red:#e17055;--yellow:#fdcb6e;--blue:#74b9ff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--muted);font-size:.95rem;margin-top:4px}
.header{text-align:center;padding:24px 16px 12px}
.tip{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 16px;max-width:500px;margin:0 auto}
.container{display:flex;flex-wrap:wrap;gap:20px;padding:0 20px 20px;max-width:1100px;margin:0 auto;justify-content:center}
.video-section{flex:1 1 400px;max-width:560px;min-width:280px}
.panel{flex:1 1 300px;max-width:480px;min-width:260px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid rgba(255,255,255,.06)}
.video-wrap{position:relative;border-radius:var(--radius);overflow:hidden;background:#000}
video{display:block;width:100%;transform:scaleX(-1)}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.status-bar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:10px;padding:8px 12px;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.loading{background:var(--yellow);animation:pulse 1.2s infinite}
.dot.ready{background:var(--green)}
.dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.7);gap:12px;font-size:.9rem;color:var(--muted);z-index:5;transition:opacity .4s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.emotion-display{text-align:center}
.emotion-emoji{font-size:3rem;line-height:1}
.emotion-label{font-size:1.5rem;font-weight:700;margin-top:6px}
.confidence-bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:.85rem}
.bar-label{width:48px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .3s ease;min-width:2px}
.bar-val{width:36px;font-size:.75rem;color:var(--muted)}
.comment-box{min-height:48px;font-size:1rem;line-height:1.5;color:var(--accent2);text-align:center;padding:8px 0}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent2);margin-left:2px;animation:blink .7s infinite;vertical-align:text-bottom}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 8px;background:rgba(255,255,255,.03);border-radius:8px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;padding:10px 16px;border:none;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;min-width:120px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--text)}
.btn-secondary:hover{background:rgba(255,255,255,.14)}
.footer{text-align:center;padding:16px;font-size:.75rem;color:var(--muted)}
.error-card{background:rgba(225,112,85,.12);border:1px solid rgba(225,112,85,.3);border-radius:var(--radius);padding:18px;text-align:center;margin:0 20px 20px}
.error-card p{margin-bottom:12px}
@media(max-width:640px){
h1{font-size:1.5rem}
.container{padding:0 12px 12px;gap:14px}
.card{padding:14px}
.emotion-emoji{font-size:2.4rem}
.emotion-label{font-size:1.2rem}
}
@media print{
body{background:#fff;color:#000}
.card{border:1px solid #ccc}
video,canvas,.btns,.loading-overlay,.status-bar,.cursor{display:none!important}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="header">
<h1>表情识别</h1>
<p class="subtitle">趣味情绪小测试 · 实时捕捉</p>
</div>
<p class="tip">看着镜头，网页会识别你的表情，看看你现在是什么心情！</p>

<div class="container">
<div class="video-section">
<div class="card" style="padding:8px">
<div class="video-wrap" id="videoWrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<span id="loadingText">正在请求摄像头…</span>
</div>
<div class="status-bar" id="statusBar" style="display:none">
<span class="dot loading" id="statusDot"></span>
<span id="statusText">初始化中</span>
</div>
</div>
</div>
</div>

<div class="panel">
<div class="card emotion-display">
<div class="emotion-emoji" id="emoji">😐</div>
<div class="emotion-label" id="label">等待识别…</div>
</div>
<div class="card">
<div class="confidence-bars" id="bars">
<div class="bar-row"><span class="bar-label">😊 开心</span><div class="bar-track"><div class="bar-fill" id="barHappy" style="width:0%;background:var(--green)"></div></div><span class="bar-val" id="valHappy">0%</span></div>
<div class="bar-row"><span class="bar-label">😮 惊讶</span><div class="bar-track"><div class="bar-fill" id="barSurprise" style="width:0%;background:var(--yellow)"></div></div><span class="bar-val" id="valSurprise">0%</span></div>
<div class="bar-row"><span class="bar-label">😌 平静</span><div class="bar-track"><div class="bar-fill" id="barCalm" style="width:0%;background:var(--blue)"></div></div><span class="bar-val" id="valCalm">0%</span></div>
<div class="bar-row"><span class="bar-label">😢 悲伤</span><div class="bar-track"><div class="bar-fill" id="barSad" style="width:0%;background:var(--red)"></div></div><span class="bar-val" id="valSad">0%</span></div>
</div>
</div>
<div class="card">
<div class="comment-box" id="commentBox"><span id="commentText"></span><span class="cursor"></span></div>
</div>
<div class="card">
<div style="font-size:.85rem;color:var(--muted);margin-bottom:8px">📋 历史记录</div>
<div class="history-list" id="historyList"><div style="font-size:.8rem;color:var(--muted)">暂无记录</div></div>
</div>
<div class="btns">
<button class="btn btn-secondary" id="btnReset">🔄 重置历史</button>
<button class="btn btn-primary" id="btnScreenshot">📸 截图保存</button>
</div>
</div>
</div>

<div class="error-card" id="errorCard" style="display:none">
<p id="errorMsg">无法访问摄像头，请检查权限设置后重试。</p>
<button class="btn btn-primary" id="btnRetry" style="max-width:200px;margin:0 auto;display:block">重试</button>
</div>

<div class="footer">表情识别基于几何分析，仅供参考娱乐</div>

<script>
(function(){
"use strict";
try{

/* ── DOM refs ── */
var video=document.getElementById('video');
var overlay=document.getElementById('overlay');
var ctx=overlay.getContext('2d');
var loadingOverlay=document.getElementById('loadingOverlay');
var loadingText=document.getElementById('loadingText');
var statusBar=document.getElementById('statusBar');
var statusDot=document.getElementById('statusDot');
var statusTextEl=document.getElementById('statusText');
var emojiEl=document.getElementById('emoji');
var labelEl=document.getElementById('label');
var commentTextEl=document.getElementById('commentText');
var historyListEl=document.getElementById('historyList');
var errorCard=document.getElementById('errorCard');
var errorMsgEl=document.getElementById('errorMsg');

var barHappy=document.getElementById('barHappy');
var barSurprise=document.getElementById('barSurprise');
var barCalm=document.getElementById('barCalm');
var barSad=document.getElementById('barSad');
var valHappy=document.getElementById('valHappy');
var valSurprise=document.getElementById('valSurprise');
var valCalm=document.getElementById('valCalm');
var valSad=document.getElementById('valSad');

/* ── Comments ── */
var comments={
happy:['今天心情不错嘛！','笑容比阳光还暖','笑一个，世界都亮了','你的笑容治愈了一切','开心是最好的护肤品','幸福感满满的一天','笑起来真好看','快乐是最好的礼物','嘴角上扬，好运登场','整个世界都在对你微笑'],
surprise:['哇，被吓到了吗？','发生什么事了？','你的眼睛里有星星','天哪，难以置信！','惊讶的表情很可爱哦','世界那么大，惊喜那么多','目瞪口呆的样子好萌','是不是发现了新大陆？'],
calm:['淡定是一种境界','心如止水','岁月静好','内心很平静呢','从容不迫的气质','稳如泰山','安静的力量','一切都在掌控中','风轻云淡，怡然自得'],
sad:['抱抱你，会好起来的','想聊聊吗？','乌云总会散的','没关系，允许自己难过','风雨过后是彩虹','你已经很棒了','明天会更好','给自己一个拥抱','一切都会过去的']
};

var emojis={happy:'😊',surprise:'😮',calm:'😌',sad:'😢'};
var labelMap={happy:'开心',surprise:'惊讶',calm:'平静',sad:'悲伤'};

/* ── State ── */
var model=null;
var currentEmotion='';
var buffer=[];
var bufferSize=5;
var history=[];
var typewriterTimer=null;
var animFrameId=null;
var lastCommentEmotion='';

/* ── Helpers ── */
function dist(a,b){return Math.sqrt(Math.pow(a[0]-b[0],2)+Math.pow(a[1]-b[1],2))}

function setStatus(state,text){
statusBar.style.display='flex';
statusDot.className='dot '+state;
statusTextEl.textContent=text;
}

function showError(msg){
errorCard.style.display='block';
errorMsgEl.textContent=msg;
loadingOverlay.classList.add('hidden');
setStatus('error','错误');
}

function hideError(){errorCard.style.display='none'}

/* ── Camera ── */
async function startCamera(){
loadingText.textContent='正在请求摄像头…';
hideError();
try{
var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
video.srcObject=stream;
await new Promise(function(r){video.onloadedmetadata=function(){r()}});
await video.play();
overlay.width=video.videoWidth;
overlay.height=video.videoHeight;
return true;
}catch(e){
var msg='无法访问摄像头';
if(e.name==='NotAllowedError')msg='摄像头权限被拒绝，请在浏览器设置中允许访问摄像头';
else if(e.name==='NotFoundError')msg='未检测到摄像头设备';
else if(e.name==='NotReadableError')msg='摄像头被其他程序占用';
showError(msg);
return false;
}
}

/* ── Model ── */
async function loadModel(){
loadingText.textContent='正在下载人脸检测模型…';
try{
model=await blazeface.load();
return true;
}catch(e){
showError('模型加载失败：'+e.message);
return false;
}
}

/* ── Expression analysis ── */
function analyzeExpression(prediction){
var landmarks=prediction.landmarks;
if(!landmarks||landmarks.length<6)return null;

var rightEye=landmarks[0];
var leftEye=landmarks[1];
var nose=landmarks[2];
var mouth=landmarks[3];
var rightEar=landmarks[4];
var leftEar=landmarks[5];

/* mouth is an array of points in blazeface */
var mouthTop,mouthBottom,mouthLeft,mouthRight;
if(Array.isArray(mouth)){
mouthTop=mouth[0];
mouthBottom=mouth[2];
mouthLeft=mouth.length>3?mouth[3]:mouth[1];
mouthRight=mouth.length>4?mouth[4]:mouth[1];
if(!mouthLeft||!mouthRight){
var mCenterX=(mouthTop[0]+mouthBottom[0])/2;
mouthLeft=mouth[1]||[mCenterX-5,mouthTop[1]];
mouthRight=mouth[1]||[mCenterX+5,mouthTop[1]];
}
}else{
mouthTop=mouth;
mouthBottom=mouth;
mouthLeft=mouth;
mouthRight=mouth;
}

var eyeDist=dist(rightEye,leftEye);
if(eyeDist<1)eyeDist=1;

var mouthWidth=Array.isArray(mouth)&&mouth.length>=2?dist(mouth[0],mouth.length>3?mouth[3]:mouth[1]):10;
var mouthHeight=Array.isArray(mouth)&&mouth.length>=3?dist(mouth[0],mouth[2]):5;
var mouthRatio=mouthHeight>0?mouthWidth/mouthHeight:2;
var mouthOpenRatio=mouthHeight/(eyeDist*0.15+1);

var noseToMouth=dist(nose,Array.isArray(mouth)?mouth[0]:mouth);
var faceWidth=dist(rightEar,leftEar);
if(faceWidth<1)faceWidth=eyeDist*1.5;

var eyeWidth=dist(rightEye,[rightEye[0]+1,rightEye[1]])||5;

/* Scores */
var happy=0,surprise=0,calm=0,sad=0;

/* Happy: wide mouth, slightly squinted eyes */
var normalizedMouthWidth=mouthWidth/faceWidth;
if(normalizedMouthWidth>0.35)happy+=40;
else if(normalizedMouthWidth>0.25)happy+=20;

var eyeSquint=1-(eyeDist/faceWidth);
if(eyeSquint>0.1)happy+=20;

/* Surprise: very open mouth, wide eyes */
if(mouthOpenRatio>2.5)surprise+=40;
else if(mouthOpenRatio>1.5)surprise+=20;
if(eyeDist/faceWidth>0.45)surprise+=25;
else if(eyeDist/faceWidth>0.35)surprise+=10;

/* Sad: mouth corners down */
if(Array.isArray(mouth)&&mouth.length>=4){
var cornersY=(mouth[1][1]+(mouth[3]?mouth[3][1]:mouth[1][1]))/2;
var centerMouthY=mouth[0][1];
if(cornersY<centerMouthY-2)sad+=30;
else if(cornersY<centerMouthY)sad+=15;
}
if(normalizedMouthWidth<0.2)sad+=15;
if(mouthOpenRatio<0.5)sad+=10;

/* Calm: everything normal */
if(normalizedMouthWidth>=0.2&&normalizedMouthWidth<=0.35)calm+=20;
if(mouthOpenRatio>=0.5&&mouthOpenRatio<=1.5)calm+=20;
var eyeRatio=eyeDist/faceWidth;
if(eyeRatio>=0.3&&eyeRatio<=0.45)calm+=25;
if(happy<15&&surprise<15&&sad<15)calm+=25;

/* Normalize to 0-100 */
var total=happy+surprise+calm+sad||1;
var scores={
happy:Math.round(happy/total*100),
surprise:Math.round(surprise/total*100),
calm:Math.round(calm/total*100),
sad:Math.round(sad/total*100)
};

/* Clamp */
var keys=['happy','surprise','calm','sad'];
keys.forEach(function(k){if(scores[k]>100)scores[k]=100;if(scores[k]<0)scores[k]=0});

/* Determine dominant */
var maxScore=0,dominant='calm';
keys.forEach(function(k){if(scores[k]>maxScore){maxScore=scores[k];dominant=k}});

return{scores:scores,dominant:dominant};
}

/* ── Debounce ── */
function debounceEmotion(emotion){
buffer.push(emotion);
if(buffer.length>bufferSize)buffer.shift();
if(buffer.length<bufferSize)return null;
var counts={};
buffer.forEach(function(e){counts[e]=(counts[e]||0)+1});
var best=null,bestCount=0;
for(var k in counts){if(counts[k]>bestCount){bestCount=counts[k];best=k}}
if(bestCount>=Math.ceil(bufferSize*0.6))return best;
return null;
}

/* ── Typewriter ── */
function typewriterEffect(text){
if(typewriterTimer)clearInterval(typewriterTimer);
commentTextEl.textContent='';
var i=0;
typewriterTimer=setInterval(function(){
if(i<text.length){
commentTextEl.textContent+=text[i];
i++;
}else{
clearInterval(typewriterTimer);
typewriterTimer=null;
}
},60);
}

function setComment(emotion){
if(emotion===lastCommentEmotion)return;
lastCommentEmotion=emotion;
var pool=comments[emotion];
if(!pool)return;
var text=pool[Math.floor(Math.random()*pool.length)];
typewriterEffect(text);
}

/* ── History ── */
function addHistory(emotion){
var now=new Date();
var time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
history.unshift({emoji:emojis[emotion],label:labelMap[emotion],time:time});
if(history.length>5)history.pop();
renderHistory();
}

function renderHistory(){
if(!history.length){
historyListEl.innerHTML='<div style="font-size:.8rem;color:var(--muted)">暂无记录</div>';
return;
}
historyListEl.innerHTML=history.map(function(h){
return '<div class="history-item"><span>'+h.emoji+' '+h.label+'</span><span style="color:var(--muted)">'+h.time+'</span></div>';
}).join('');
}

/* ── Draw overlay ── */
function drawDetections(predictions){
ctx.clearRect(0,0,overlay.width,overlay.height);
predictions.forEach(function(pred){
var box=pred.topLeft;
var box2=pred.bottomRight;
var w=box2[0]-box[0];
var h=box2[1]-box[1];

ctx.strokeStyle='rgba(108,92,231,0.8)';
ctx.lineWidth=2;
ctx.beginPath();
var r=8;
ctx.moveTo(box[0]+r,box[1]);
ctx.lineTo(box2[0]-r,box[1]);
ctx.quadraticCurveTo(box2[0],box[1],box2[0],box[1]+r);
ctx.lineTo(box2[0],box2[1]-r);
ctx.quadraticCurveTo(box2[0],box2[1],box2[0]-r,box2[1]);
ctx.lineTo(box[0]+r,box2[1]);
ctx.quadraticCurveTo(box[0],box2[1],box[0],box2[1]-r);
ctx.lineTo(box[0],box[1]+r);
ctx.quadraticCurveTo(box[0],box[1],box[0]+r,box[1]);
ctx.closePath();
ctx.stroke();

if(pred.landmarks){
ctx.fillStyle='rgba(162,155,254,0.9)';
pred.landmarks.forEach(function(pt){
if(Array.isArray(pt)){
ctx.beginPath();
ctx.arc(pt[0],pt[1],3,0,Math.PI*2);
ctx.fill();
}
});
}
});
}

/* ── Update UI ── */
function updateBars(scores){
barHappy.style.width=scores.happy+'%';
valHappy.textContent=scores.happy+'%';
barSurprise.style.width=scores.surprise+'%';
valSurprise.textContent=scores.surprise+'%';
barCalm.style.width=scores.calm+'%';
valCalm.textContent=scores.calm+'%';
barSad.style.width=scores.sad+'%';
valSad.textContent=scores.sad+'%';
}

function updateEmotionDisplay(emotion,scores){
if(emotion!==currentEmotion){
currentEmotion=emotion;
emojiEl.textContent=emojis[emotion]||'😐';
labelEl.textContent=labelMap[emotion]||'未知';
setComment(emotion);
addHistory(emotion);
}
updateBars(scores);
}

/* ── Main loop ── */
async function detectLoop(){
if(!model||video.paused||video.ended){
animFrameId=requestAnimationFrame(detectLoop);
return;
}
try{
var predictions=await model.estimateFaces(video,false);
drawDetections(predictions);
if(predictions.length>0){
var result=analyzeExpression(predictions[0]);
if(result){
var debounced=debounceEmotion(result.dominant);
if(debounced){
updateEmotionDisplay(debounced,result.scores);
}
}
}else{
ctx.clearRect(0,0,overlay.width,overlay.height);
}
}catch(e){/* skip frame */}
animFrameId=requestAnimationFrame(detectLoop);
}

/* ── Screenshot ── */
function takeScreenshot(){
var c=document.createElement('canvas');
c.width=video.videoWidth;
c.height=video.videoHeight;
var sctx=c.getContext('2d');
sctx.drawImage(video,0,0);

var emotionLabel=currentEmotion?emojis[currentEmotion]+' '+labelMap[currentEmotion]:'';
sctx.fillStyle='rgba(0,0,0,0.5)';
sctx.fillRect(0,c.height-40,c.width,40);
sctx.fillStyle='#fff';
sctx.font='16px sans-serif';
sctx.fillText('表情识别 · '+emotionLabel+' · '+new Date().toLocaleString(),12,c.height-14);

c.toBlob(function(blob){
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='表情截图_'+Date.now()+'.png';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
},'image/png');
}

/* ── Events ── */
document.getElementById('btnReset').addEventListener('click',function(){
history=[];
renderHistory();
currentEmotion='';
lastCommentEmotion='';
buffer=[];
emojiEl.textContent='😐';
labelEl.textContent='等待识别…';
commentTextEl.textContent='';
barHappy.style.width='0%';valHappy.textContent='0%';
barSurprise.style.width='0%';valSurprise.textContent='0%';
barCalm.style.width='0%';valCalm.textContent='0%';
barSad.style.width='0%';valSad.textContent='0%';
});

document.getElementById('btnScreenshot').addEventListener('click',takeScreenshot);
btnRetry.addEventListener('click',function(){init()});

/* ── Init ── */
async function init(){
hideError();
loadingOverlay.classList.remove('hidden');
loadingText.textContent='正在请求摄像头…';

var camOk=await startCamera();
