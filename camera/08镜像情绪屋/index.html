<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>镜像情绪屋 | Mirror Emotion Room</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --bg-dark: #0a0a0f;
      --text-light: #f1f5f9;
      --border-radius: 20px;
      --transition-speed: 0.5s;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
    }

    .header {
      text-align: center;
      animation: fadeInDown 0.8s ease-out;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      opacity: 0.7;
      font-weight: 300;
    }

    .mirror-container {
      position: relative;
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3), 0 0 100px rgba(139, 92, 246, 0.2);
      background: rgba(15, 15, 25, 0.8);
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-out;
    }

    #video {
      display: block;
      width: 640px;
      max-width: 90vw;
      height: auto;
      aspect-ratio: 4/3;
      transform: scaleX(-1);
      border-radius: var(--border-radius);
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: var(--border-radius);
    }

    .emotion-label {
      position: fixed;
      top: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      background: rgba(15, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all var(--transition-speed) ease;
      animation: fadeInRight 0.8s ease-out;
    }

    .emotion-emoji {
      font-size: 1.5rem;
      animation: bounce 2s infinite;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 100;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    .loading-text {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .instruction {
      position: fixed;
      bottom: 4rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      padding: 1.5rem 2rem;
      background: rgba(15, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 16px;
      max-width: 500px;
      animation: fadeInUp 0.8s ease-out;
    }

    .instruction p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .footer {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      opacity: 0.5;
      text-align: center;
    }

    .error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 2rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      max-width: 400px;
      z-index: 100;
    }

    .error-message h3 {
      color: #ef4444;
      margin-bottom: 1rem;
    }

    .error-message button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .error-message button:hover {
      background: var(--secondary);
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 768px) {
      .mirror-container {
        margin-top: 1rem;
      }
      
      #video {
        width: 320px;
      }

      .emotion-label {
        top: 1rem;
        right: 1rem;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
      }

      .instruction {
        bottom: 5rem;
        max-width: 90vw;
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1rem;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      #backgroundCanvas,
      .loading,
      .instruction,
      .footer {
        display: none;
      }

      .mirror-container {
        box-shadow: none;
        border: 2px solid #000;
      }
    }
  </style>
</head>
<body>
  <canvas id="backgroundCanvas"></canvas>

  <div class="container">
    <div class="header">
      <h1>镜像情绪屋</h1>
      <p class="subtitle">你的情绪改变整个房间</p>
    </div>

    <div class="mirror-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <div class="emotion-label">
    <span class="emotion-emoji">🔍</span>
    <span id="emotionText">初始化中...</span>
  </div>

  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <p class="loading-text" id="loadingText">正在加载模型...</p>
  </div>

  <div class="instruction" id="instruction" style="display: none;">
    <p>看着镜子，让你的情绪改变整个房间。<br>微笑、惊讶、低头、遮挡镜头，都会看到不同变化。</p>
  </div>

  <div class="footer">情绪识别基于几何分析，仅供参考娱乐</div>

  <div class="error-message" id="errorMessage" style="display: none;">
    <h3>摄像头访问失败</h3>
    <p>无法访问摄像头，请确保已授权摄像头权限。</p>
    <button onclick="location.reload()">重新尝试</button>
  </div>

  <script>
    (function() {
      'use strict';

      try {
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const bgCanvas = document.getElementById('backgroundCanvas');
        const emotionText = document.getElementById('emotionText');
        const emotionEmoji = document.querySelector('.emotion-emoji');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const instruction = document.getElementById('instruction');
        const errorMessage = document.getElementById('errorMessage');

        const bgCtx = bgCanvas.getContext('2d');
        const overlayCtx = overlay.getContext('2d');

        let model = null;
        let currentEmotion = 'neutral';
        let emotionBuffer = [];
        const BUFFER_SIZE = 5;
        let particles = [];
        let ripples = [];
        let time = 0;

        const EMOTIONS = {
          happy: { emoji: '😊', text: '开心', color: [255, 215, 0] },
          neutral: { emoji: '😐', text: '平静', color: [100, 149, 237] },
          surprised: { emoji: '😮', text: '惊讶', color: [255, 105, 180] },
          occluded: { emoji: '🌫️', text: '遮挡', color: [50, 50, 50] }
        };

        function resizeCanvas() {
          bgCanvas.width = window.innerWidth;
          bgCanvas.height = window.innerHeight;
          overlay.width = video.videoWidth || 640;
          overlay.height = video.videoHeight || 480;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = -Math.random() * 3 - 2;
            this.life = 1;
            this.decay = Math.random() * 0.01 + 0.005;
            this.size = Math.random() * 4 + 2;
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05;
            this.life -= this.decay;
          }

          draw(ctx) {
            ctx.fillStyle = `rgba(255, 215, 0, ${this.life})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        class Ripple {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = Math.max(bgCanvas.width, bgCanvas.height);
            this.life = 1;
          }

          update() {
            this.radius += 8;
            this.life = 1 - (this.radius / this.maxRadius);
          }

          draw(ctx) {
            ctx.strokeStyle = `rgba(255, 105, 180, ${this.life * 0.5})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        function detectEmotion(faces) {
          if (!faces || faces.length === 0) {
            return 'occluded';
          }

          const face = faces[0];
          const keypoints = face.landmarks;
          
          const leftEye = keypoints[0];
          const rightEye = keypoints[1];
          const nose = keypoints[2];
          const mouth = keypoints[3];
          const rightEar = keypoints[4];
          const leftEar = keypoints[5];

          const eyeDistance = Math.hypot(leftEye[0] - rightEye[0], leftEye[1] - rightEye[1]);
          const eyeCenter = [(leftEye[0] + rightEye[0]) / 2, (leftEye[1] + rightEye[1]) / 2];
          
          const eyeToMouthDist = Math.abs(mouth[1] - eyeCenter[1]);
          const eyeToNoseDist = Math.abs(nose[1] - eyeCenter[1]);
          const noseToMouthDist = Math.abs(mouth[1] - nose[1]);

          if (noseToMouthDist < eyeToMouthDist * 0.3 || eyeToMouthDist < 20) {
            return 'occluded';
          }

          const faceHeight = eyeToMouthDist;
          const faceWidth = eyeDistance;

          if (noseToMouthDist > faceHeight * 0.6) {
            return 'surprised';
          }

          if (eyeDistance > 0 && noseToMouthDist / faceHeight > 0.4) {
            return 'happy';
          }

          return 'neutral';
        }

        function updateEmotionBuffer(emotion) {
          emotionBuffer.push(emotion);
          if (emotionBuffer.length > BUFFER_SIZE) {
            emotionBuffer.shift();
          }

          if (emotionBuffer.length === BUFFER_SIZE) {
            const counts = {};
            emotionBuffer.forEach(e => counts[e] = (counts[e] || 0) + 1);
            
            for (const [emotion, count] of Object.entries(counts)) {
              if (count === BUFFER_SIZE && emotion !== currentEmotion) {
                currentEmotion = emotion;
                updateEmotionDisplay();
              }
            }
          }
        }

        function updateEmotionDisplay() {
          const emotion = EMOTIONS[currentEmotion];
          emotionEmoji.textContent = emotion.emoji;
          emotionText.textContent = emotion.text;

          const [r, g, b] = emotion.color;
          document.querySelector('.emotion-label').style.borderColor = `rgba(${r}, ${g}, ${b}, 0.5)`;
        }

        function drawHappyBackground() {
          bgCtx.fillStyle = 'rgba(10, 10, 15, 0.05)';
          bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

          if (particles.length < 100) {
            particles.push(new Particle(
              Math.random() * bgCanvas.width,
              bgCanvas.height + 10
            ));
          }

          particles = particles.filter(p => {
            p.update();
            p.draw(bgCtx);
            return p.life > 0;
          });
        }

        function drawNeutralBackground() {
          bgCtx.fillStyle = 'rgba(10, 10, 15, 0.1)';
          bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

          for (let i = 0; i < 5; i++) {
            const y = (bgCanvas.height / 5) * i + Math.sin(time * 0.001 + i) * 20;
            const gradient = bgCtx.createLinearGradient(0, y - 50, 0, y + 50);
            gradient.addColorStop(0, 'rgba(100, 149, 237, 0)');
            gradient.addColorStop(0.5, 'rgba(100, 149, 237, 0.1)');
            gradient.addColorStop(1, 'rgba(100, 149, 237, 0)');
            
            bgCtx.fillStyle = gradient;
            bgCtx.fillRect(0, y - 50, bgCanvas.width, 100);
          }
        }

        function drawSurprisedBackground() {
          bgCtx.fillStyle = 'rgba(10, 10, 15, 0.05)';
          bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

          if (ripples.length === 0 || Math.random() < 0.1) {
            ripples.push(new Ripple(
              bgCanvas.width / 2 + (Math.random() - 0.5) * 200,
              bgCanvas.height / 2 + (Math.random() - 0.5) * 200
            ));
          }

          ripples = ripples.filter(r => {
            r.update();
            r.draw(bgCtx);
            return r.life > 0;
          });
        }

        function drawOccludedBackground() {
          bgCtx.fillStyle = 'rgba(10, 10, 15, 0.3)';
          bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

          const gradient = bgCtx.createRadialGradient(
            bgCanvas.width / 2, bgCanvas.height / 2, 0,
            bgCanvas.width / 2, bgCanvas.height / 2, bgCanvas.width / 2
          );
          gradient.addColorStop(0, 'rgba(50, 50, 50, 0)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
          
          bgCtx.fillStyle = gradient;
          bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        }

        function renderBackground() {
          switch (currentEmotion) {
            case 'happy':
              drawHappyBackground();
              break;
            case 'neutral':
              drawNeutralBackground();
              break;
            case 'surprised':
              drawSurprisedBackground();
              break;
            case 'occluded':
              drawOccludedBackground();
              break;
          }
        }

        async function detectFaces() {
          if (!model) return;

          try {
            const predictions = await model.estimateFaces(video, false);
            
            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

            if (predictions.length > 0) {
              const face = predictions[0];
              const keypoints = face.landmarks;

              overlayCtx.strokeStyle = 'rgba(99, 102, 241, 0.6)';
              overlayCtx.lineWidth = 2;
              overlayCtx.beginPath();
              overlayCtx.moveTo(keypoints[0][0], keypoints[0][1]);
              overlayCtx.lineTo(keypoints[1][0], keypoints[1][1]);
              overlayCtx.lineTo(keypoints[2][0], keypoints[2][1]);
              overlayCtx.lineTo(keypoints[3][0], keypoints[3][1]);
              overlayCtx.closePath();
              overlayCtx.stroke();

              keypoints.forEach(point => {
                overlayCtx.fillStyle = 'rgba(255, 215, 0, 0.8)';
                overlayCtx.beginPath();
                overlayCtx.arc(point[0], point[1], 3, 0, Math.PI * 2);
                overlayCtx.fill();
              });
            }

            const emotion = detectEmotion(predictions);
            updateEmotionBuffer(emotion);
          } catch (err) {
            console.error('Detection error:', err);
          }
        }

        let lastDetectionTime = 0;
        const DETECTION_INTERVAL = 1000 / 15;

        function animate(timestamp) {
          time = timestamp;
          renderBackground();

          if (timestamp - lastDetectionTime >= DETECTION_INTERVAL) {
            detectFaces();
            lastDetectionTime = timestamp;
          }

          requestAnimationFrame(animate);
        }

        async function init() {
          try {
            loadingText.textContent = '正在请求摄像头权限...';
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: 640, height: 480, facingMode: 'user' }
            });
            video.srcObject = stream;

            await new Promise(resolve => {
              video.onloadedmetadata = resolve;
            });

            resizeCanvas();
            
            loadingText.textContent = '正在加载 AI 模型...';
            model = await blazeface.load();

            loading.style.display = 'none';
            instruction.style.display = 'block';

            setTimeout(() => {
              instruction.style.opacity = '0';
              instruction.style.transition = 'opacity 1s';
              setTimeout(() => instruction.style.display = 'none', 1000);
            }, 5000);

            requestAnimationFrame(animate);
          } catch (err) {
            console.error('Initialization error:', err);
            loading.style.display = 'none';
            errorMessage.style.display = 'block';
          }
        }

        init();
      } catch (err) {
        console.error('Critical error:', err);
        document.body.innerHTML = '<div style="color: white; padding: 2rem; text-align: center;"><h2>发生错误</h2><p>请刷新页面重试</p></div>';
      }
    })();
  </script>
</body>
</html>
