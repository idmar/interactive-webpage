<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人声变形</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#2d1b69);color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
h1{text-align:center;margin:32px 0 8px;font-size:2.2rem;background:linear-gradient(90deg,#ff6b6b,#a855f7,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px}
.subtitle{color:#888;font-size:.85rem;margin-bottom:24px;letter-spacing:2px}
.status{font-size:.9rem;color:#aaa;min-height:1.4em;margin-bottom:12px;text-align:center}
.record-area{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.record-btn{width:120px;height:120px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 35%,#ff4757,#c0392b);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 0 30px rgba(255,71,87,.4);transition:transform .15s,box-shadow .15s;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
.record-btn .icon{font-size:2.4rem;line-height:1}
.record-btn:active,.record-btn.active{transform:scale(1.08);box-shadow:0 0 50px rgba(255,71,87,.7)}
.record-btn.recording{animation:pulse 1s ease-in-out infinite;background:radial-gradient(circle at 35% 35%,#ff6b6b,#e74c3c)}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 30px rgba(255,71,87,.5)}50%{transform:scale(1.06);box-shadow:0 0 60px rgba(255,71,87,.8)}}
.record-hint{margin-top:10px;font-size:.8rem;color:#777}
canvas{width:340px;height:80px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:20px}
.duration{font-size:1.1rem;font-variant-numeric:tabular-nums;color:#a855f7;margin-bottom:16px;min-height:1.4em}
.presets{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px;margin-bottom:24px}
.preset-btn{padding:8px 18px;border-radius:20px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;color:#fff;opacity:.85}
.preset-btn:hover{opacity:1;transform:translateY(-2px)}
.preset-btn.playing{opacity:1;box-shadow:0 0 16px rgba(255,255,255,.3);transform:scale(1.05)}
.p-reset{background:linear-gradient(135deg,#636e72,#2d3436)}
.p-chipmunk{background:linear-gradient(135deg,#fdcb6e,#e17055)}
.p-monster{background:linear-gradient(135deg,#6c5ce7,#2d3436)}
.p-robot{background:linear-gradient(135deg,#00cec9,#0984e3)}
.p-underwater{background:linear-gradient(135deg,#0984e3,#00b894)}
.p-alien{background:linear-gradient(135deg,#a855f7,#ec4899)}
.p-echo{background:linear-gradient(135deg,#74b9ff,#a29bfe)}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px 28px;max-width:400px;width:90%;margin-bottom:40px}
.panel h3{font-size:.95rem;color:#a855f7;margin-bottom:14px;letter-spacing:1px}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider-row label{font-size:.85rem;color:#aaa;width:60px;text-align:right;flex-shrink:0}
.slider-row input[type=range]{flex:1;accent-color:#a855f7;height:6px}
.slider-row .val{font-size:.85rem;color:#ddd;width:56px;font-variant-numeric:tabular-nums}
.play-custom{width:100%;padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .2s}
.play-custom:hover{opacity:.9}
.stop-btn{margin-top:10px;padding:8px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#aaa;font-size:.85rem;cursor:pointer;display:none}
.stop-btn.show{display:inline-block}
</style>
</head>
<body>
<h1>人 声 变 形</h1>
<p class="subtitle">VOICE TRANSFORMER</p>
<p class="status" id="status">长按按钮开始录音</p>

<div class="record-area">
  <button class="record-btn" id="recBtn"><span class="icon">🎙</span><span style="font-size:.75rem;margin-top:4px">长按录音</span></button>
  <p class="record-hint">按住录音 · 松手停止</p>
</div>

<canvas id="waveCanvas" width="680" height="160"></canvas>
<div class="duration" id="duration"></div>

<div class="presets" id="presets" style="opacity:0;pointer-events:none;transition:opacity .4s">
  <button class="preset-btn p-reset" data-fx="normal">🔊 原声</button>
  <button class="preset-btn p-chipmunk" data-fx="chipmunk">🐿️ 花栗鼠</button>
  <button class="preset-btn p-monster" data-fx="monster">👹 怪兽</button>
  <button class="preset-btn p-robot" data-fx="robot">🤖 机器人</button>
  <button class="preset-btn p-underwater" data-fx="underwater">🌊 水下</button>
  <button class="preset-btn p-alien" data-fx="alien">👽 外星人</button>
  <button class="preset-btn p-echo" data-fx="echo">🔉 回声</button>
</div>

<div class="panel" style="opacity:0;pointer-events:none;transition:opacity .4s" id="customPanel">
  <h3>⚗️ 自定义调音台</h3>
  <div class="slider-row">
    <label>音高</label>
    <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0">
    <span class="val" id="pitchVal">0 半音</span>
  </div>
  <div class="slider-row">
    <label>速度</label>
    <input type="range" id="speedSlider" min="0.5" max="2" step="0.05" value="1">
    <span class="val" id="speedVal">1.00x</span>
  </div>
  <button class="play-custom" id="playCustom">▶ 播放自定义效果</button>
  <button class="stop-btn" id="stopBtn">■ 停止播放</button>
</div>

<script>
const recBtn=document.getElementById('recBtn'),
      statusEl=document.getElementById('status'),
      canvasEl=document.getElementById('waveCanvas'),
      ctx=canvasEl.getContext('2d'),
      durationEl=document.getElementById('duration'),
      presetsEl=document.getElementById('presets'),
      customPanel=document.getElementById('customPanel'),
      pitchSlider=document.getElementById('pitchSlider'),
      speedSlider=document.getElementById('speedSlider'),
      pitchVal=document.getElementById('pitchVal'),
      speedVal=document.getElementById('speedVal'),
      playCustomBtn=document.getElementById('playCustom'),
      stopBtn=document.getElementById('stopBtn');

let audioCtx,mediaRecorder,analyser,stream,recordedChunks=[],
    audioBuffer=null,sourceNode=null,timerInterval=null,startTime=0,
    isRecording=false,animId=null,currentFx='';

// Recording
recBtn.addEventListener('mousedown',startRecord);
recBtn.addEventListener('mouseup',stopRecord);
recBtn.addEventListener('mouseleave',e=>{if(isRecording)stopRecord()});
recBtn.addEventListener('touchstart',e=>{e.preventDefault();startRecord()},{passive:false});
recBtn.addEventListener('touchend',e=>{e.preventDefault();stopRecord()});

async function startRecord(){
  if(isRecording)return;
  isRecording=true;
  recBtn.classList.add('recording');
  statusEl.textContent='🔴 录音中...';
  durationEl.textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=512;
    src.connect(analyser);
    mediaRecorder=new MediaRecorder(stream);
    recordedChunks=[];
    mediaRecorder.ondataavailable=e=>recordedChunks.push(e.data);
    mediaRecorder.onstop=onRecordStop;
    mediaRecorder.start();
    startTime=Date.now();
    timerInterval=setInterval(updateDuration,100);
    drawLiveWave();
  }catch(e){
    statusEl.textContent='❌ 无法访问麦克风';
    isRecording=false;
    recBtn.classList.remove('recording');
  }
}

function stopRecord(){
  if(!isRecording)return;
  isRecording=false;
  recBtn.classList.remove('recording');
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
  clearInterval(timerInterval);
  cancelAnimationFrame(animId);
}

async function onRecordStop(){
  stream.getTracks().forEach(t=>t.stop());
  statusEl.textContent='⏳ 处理录音...';
  const blob=new Blob(recordedChunks,{type:'audio/webm'});
  const arrayBuf=await blob.arrayBuffer();
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioBuffer=await audioCtx.decodeAudioData(arrayBuf);
  statusEl.textContent='✅ 录音完成！选择效果播放';
  drawStaticWave();
  presetsEl.style.opacity='1';presetsEl.style.pointerEvents='auto';
  customPanel.style.opacity='1';customPanel.style.pointerEvents='auto';
  stopBtn.classList.add('show');
}

function updateDuration(){
  const s=((Date.now()-startTime)/1000).toFixed(1);
  durationEl.textContent=s+'s';
}

// Waveform drawing
function drawLiveWave(){
  if(!isRecording)return;
  animId=requestAnimationFrame(drawLiveWave);
  const data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  ctx.fillStyle='rgba(26,26,46,.3)';
  ctx.fillRect(0,0,canvasEl.width,canvasEl.height);
  ctx.lineWidth=2;
  ctx.strokeStyle='#a855f7';
  ctx.beginPath();
  const sliceW=canvasEl.width/data.length;
  for(let i=0;i<data.length;i++){
    const v=data[i]/128,y=v*canvasEl.height/2;
    i===0?ctx.moveTo(0,y):ctx.lineTo(i*sliceW,y);
  }
  ctx.stroke();
}

function drawStaticWave(){
  if(!audioBuffer)return;
  const data=audioBuffer.getChannelData(0);
  ctx.fillStyle='rgba(26,26,46,.9)';
  ctx.fillRect(0,0,canvasEl.width,canvasEl.height);
  ctx.lineWidth=1.5;
  ctx.strokeStyle='#06b6d4';
  ctx.beginPath();
  const step=Math.floor(data.length/canvasEl.width);
  for(let x=0;x<canvasEl.width;x++){
    let min=1,max=-1;
    for(let j=0;j<step;j++){
      const v=data[x*step+j]||0;
      if(v<min)min=v;if(v>max)max=v;
    }
    ctx.moveTo(x,(1+min)*canvasEl.height/2);
    ctx.lineTo(x,(1+max)*canvasEl.height/2);
  }
  ctx.stroke();
}

// Effects
const FX={
  normal:{rate:1,detune:0},
  chipmunk:{rate:1.5,detune:1200},
  monster:{rate:0.7,detune:-1200},
  robot:{rate:1,detune:0,ringMod:true},
  underwater:{rate:0.95,detune:-300,lpf:800},
  alien:{rate:1,detune:0,ringMod:true,vibrato:true},
  echo:{rate:1,detune:0,delay:true}
};

document.getElementById('presets').addEventListener('click',e=>{
  const btn=e.target.closest('.preset-btn');
  if(!btn||!audioBuffer)return;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');
  currentFx=btn.dataset.fx;
  stopPlayback();
  playEffect(FX[currentFx]);
});

function stopPlayback(){
  if(sourceNode){try{sourceNode.stop()}catch(e){}}
  sourceNode=null;
}

function playEffect(fx){
  stopPlayback();
  sourceNode=audioCtx.createBufferSource();
  sourceNode.buffer=audioBuffer;
  sourceNode.playbackRate.value=fx.rate;
  if(fx.detune)sourceNode.detune.value=fx.detune;

  let lastNode=sourceNode;

  // Ring modulation (robot/alien)
  if(fx.ringMod){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='square';
    osc.frequency.value=fx.vibrato?30:40;
    gain.gain.value=0;
    osc.connect(gain.gain);
    osc.start();
    const merger=audioCtx.createGain();
    lastNode.connect(merger);
    gain.connect(merger.gain);
    lastNode=merger;
  }

  // Low pass (underwater)
  if(fx.lpf){
    const filt=audioCtx.createBiquadFilter();
    filt.type='lowpass';
    filt.frequency.value=fx.lpf;
    lastNode.connect(filt);
    lastNode=filt;
  }

  // Delay/echo
  if(fx.delay){
    const dry=audioCtx.createGain();dry.gain.value=0.7;
    const wet=audioCtx.createGain();wet.gain.value=0.5;
    const del=audioCtx.createDelay();del.delayTime.value=0.25;
    const fb=audioCtx.createGain();fb.gain.value=0.4;
    lastNode.connect(dry);
    lastNode.connect(del);
    del.connect(fb);fb.connect(del);
    del.connect(wet);
    const merger=audioCtx.createGain();
    dry.connect(merger);wet.connect(merger);
    lastNode=merger;
  }

  lastNode.connect(audioCtx.destination);
  sourceNode.onended=()=>{
    document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('playing'));
    sourceNode=null;
  };
  sourceNode.start();
}

// Custom
pitchSlider.oninput=()=>pitchVal.textContent=pitchSlider.value+' 半音';
speedSlider.oninput=()=>speedVal.textContent=parseFloat(speedSlider.value).toFixed(2)+'x';

playCustomBtn.onclick=()=>{
  if(!audioBuffer)return;
  stopPlayback();
  const semi=parseInt(pitchSlider.value);
  const rate=parseFloat(speedSlider.value);
  sourceNode=audioCtx.createBufferSource();
  sourceNode.buffer=audioBuffer;
  sourceNode.playbackRate.value=Math.pow(2,semi/12)*rate;
  sourceNode.connect(audioCtx.destination);
  sourceNode.onended=()=>{sourceNode=null};
  sourceNode.start();
  statusEl.textContent=`🎵 播放中: ${semi>0?'+':''}${semi}半音 / ${rate.toFixed(2)}x`;
};

stopBtn.onclick=()=>{stopPlayback();statusEl.textContent='⏹ 已停止'};
</script>
</body>
</html>
